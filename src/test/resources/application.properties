# Test configuration — runs fully offline against an in-memory H2 database.
# Activated by @ActiveProfiles("test") on integration tests and by the CI job.
spring.datasource.url=jdbc:h2:mem:fraude-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Stripe is not exercised in tests.
stripe.secret-key=
